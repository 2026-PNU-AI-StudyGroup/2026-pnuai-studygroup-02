<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 식재료 인식 및 영양 분석 시스템</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="app-header-inner">
            <span class="app-logo">냉장고 데이터를 부탁해 <span>&lt;&lt;</span></span>
        </div>
    </header>

    <main class="container">

        <!-- ============ 1. 분석 화면 ============ -->
        <section id="view-analysis" class="app-view">
            <div class="dashboard-grid">

                <!-- 사용자 프로필 설정 -->
                <section id="sec-profile" class="app-card">
                    <h2>👤 사용자 프로필 설정</h2>
                    <div class="form-group">
                        <label>성별</label>
                        <div id="gender-toggle" class="toggle-container">
                            <span class="toggle-placeholder">성별 선택 토글 (대기 중)</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="age-input">나이</label>
                        <input type="number" id="age-input" placeholder="나이를 입력하세요" min="1" max="120">
                    </div>
                </section>

                <!-- 식재료 이미지 업로드 -->
                <section id="sec-upload" class="app-card">
                    <h2>📤 식재료 이미지 업로드</h2>
                    <label for="file-input" id="dropzone" class="upload-dropzone">
                        <span class="upload-dropzone-icon">📷</span>
                        <span class="upload-dropzone-text">이미지를 드래그하거나<br>클릭하여 업로드</span>
                        <input type="file" id="file-input" multiple accept="image/*" hidden>
                    </label>
                    <div id="preview-list" class="preview-container">
                        <p class="placeholder-text">선택한 이미지 미리보기가 여기에 표시됩니다.</p>
                    </div>
                    <button id="recognize-btn" class="btn-primary">식재료 인식하기</button>
                </section>

                <!-- 식재료 인식 결과 -->
                <section id="sec-result" class="app-card">
                    <h2>🔍 식재료 인식 결과</h2>
                    <div id="result-cards" class="tag-list">
                        <p class="placeholder-text">인식된 식재료가 여기에 태그로 표시됩니다.</p>
                    </div>
                    <div class="form-group">
                        <label class="rice-toggle-label">
                            <input type="checkbox" id="rice-toggle-checkbox">
                            🍚 쌀을 기본 재료로 추가
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="manual-ingredient-input">식재료 직접 추가</label>
                        <input type="text" id="manual-ingredient-input" placeholder="추가할 식재료 이름을 입력하세요">
                    </div>
                    <div class="btn-group">
                        <button id="add-ingredient-btn" class="btn-secondary">식재료 직접 추가</button>
                        <button id="analyze-btn" class="btn-primary">영양소 분석하기</button>
                    </div>
                </section>

                <!-- 종합 영양 분석: 이미지 업로드/인식 이후에 나오는 결과이므로 흐름상 맨 뒤에 배치 -->
                <section id="sec-nutrition" class="app-card app-card-highlight">
                    <h2>📊 종합 영양 분석</h2>
                    <div id="nutrition-bars" class="chart-container">
                        <p class="placeholder-text">칼로리, 탄수화물, 단백질, 지방 등 영양소 그래프가 여기에 표시됩니다.</p>
                    </div>
                    <div id="deficient-cards" class="cards-container">
                        <p class="placeholder-text">나이와 성별 대비 부족한 영양소 카드가 여기에 표시됩니다.</p>
                    </div>
                </section>

            </div>

            <section class="app-card">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>기본 소스 보유 현황 (체크한 항목은 레시피 추천 시 보유 재료로 반영됩니다)</label>
                    <div id="pantry-checklist" class="pantry-checklist">
                        <label><input type="checkbox" value="소금"> 소금</label>
                        <label><input type="checkbox" value="설탕"> 설탕</label>
                        <label><input type="checkbox" value="간장"> 간장</label>
                        <label><input type="checkbox" value="된장"> 된장</label>
                        <label><input type="checkbox" value="고추장"> 고추장</label>
                        <label><input type="checkbox" value="식초"> 식초</label>
                        <label><input type="checkbox" value="참기름"> 참기름</label>
                        <label><input type="checkbox" value="후추"> 후추</label>
                        <label><input type="checkbox" value="고춧가루"> 고춧가루</label>
                    </div>
                </div>
            </section>

            <button id="recommend-btn" class="btn-primary btn-huge">🍳 레시피 추천 받기</button>
        </section>

        <!-- ============ 2. 레시피 추천 화면 ============ -->
        <section id="view-recipe" class="app-view" hidden>
            <button type="button" id="back-to-analysis-btn" class="btn-back">← 분석 화면으로</button>
            <h2 class="view-title">레시피 추천</h2>
            <div id="recipe-cards">
                <p class="placeholder-text">부족한 영양소를 채워줄 추천 레시피가 여기에 표시됩니다.</p>
            </div>
        </section>

    </main>

    <!-- appState를 먼저 정의하는 state.js를 가장 먼저 로드하고, 그 상태를 사용하는 모듈들을 뒤이어 로드한다 -->
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/nutrition.js"></script>
    <script src="js/recipes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
